name: packages

on:
  workflow_call:
    secrets:
      SIGNING_SECRET:
        required: true
      SIGNING_PASSWORD:
        required: true
  workflow_dispatch:

permissions: {}

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install tools
        run: build/ci-need.sh skopeo:skopeo

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.3

      - name: Plan
        id: plan
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          build/pkg-plan.sh "$RUNNER_TEMP/build.json"
          echo "build=$(cat "$RUNNER_TEMP/build.json")" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    if: needs.list.outputs.build != '[]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list.outputs.build) }}
    env:
      PKG: ${{ matrix.package }}
      JUST_VERSION: 1.58.0
      JUST_SHA256: 748237128c4c40cbdabc65e841d05ceba13cc23a91eaba395495894c1d9764df
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install tools
        run: |
          build/ci-need.sh podman:podman
          tarball=just-$JUST_VERSION-aarch64-unknown-linux-musl.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/casey/just/releases/download/$JUST_VERSION/$tarball"
          echo "$JUST_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" just
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build
        run: just pkg "$PKG"

      - name: Save
        env:
          STATE: ${{ matrix.state }}
        run: |
          [[ $STATE == missing || $STATE == unsigned ]] || { echo "::error::bad state '$STATE' for $PKG"; exit 1; }
          mkdir -p "$RUNNER_TEMP/save"
          podman save --format oci-archive -o "$RUNNER_TEMP/save/$STATE.oci.tar" "localhost/blockie-pkg/$PKG:$(build/pkg-hash.sh "$PKG")"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pkg-${{ matrix.package }}
          path: ${{ runner.temp }}/save
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  publish:
    needs: [list, build]
    if: ${{ !cancelled() && needs.list.result == 'success' && needs.list.outputs.build != '[]' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list.outputs.build) }}
    env:
      PKG: ${{ matrix.package }}
      REPO: ghcr.io/seilent/blockie/pkg/${{ matrix.package }}
      PUBKEY: system_files/usr/share/blockie/keys/blockie.pub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: pkg-${{ matrix.package }}
          path: ${{ runner.temp }}/pkg
          merge-multiple: true

      - name: Install tools
        run: build/ci-need.sh skopeo:skopeo

      - name: Built
        id: built
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/pkg/*)
          if (( ${#files[@]} == 0 )); then
            hash=$(build/pkg-hash.sh "$PKG")
            if err=$(skopeo inspect --no-creds --raw "docker://$REPO:$hash" 2>&1 > /dev/null); then
              echo "$PKG was not built in this run, $REPO:$hash exists"
              exit 0
            fi
            if [[ -n $(git ls-files -- "packages/$PKG/LOCAL") ]]; then
              echo "::warning::$REPO:$hash is missing and comes from the build PC (just pkg-push $PKG)"
              exit 0
            fi
            echo "::error::$PKG was not built in this run and $REPO:$hash is not readable: $err"
            exit 1
          fi
          [[ ${#files[@]} == 1 && ${files[0]##*/} =~ ^(missing|unsigned)\.oci\.tar$ ]] || { echo "::error::unexpected artifact files: ${files[*]##*/}"; exit 1; }
          replace=false
          [[ ${files[0]##*/} != unsigned.oci.tar ]] || replace=true
          {
            echo "archive=${files[0]}"
            echo "replace=$replace"
            echo "hash=$(build/pkg-hash.sh "$PKG")"
          } >> "$GITHUB_OUTPUT"

      - name: Check archive
        if: steps.built.outputs.archive != ''
        env:
          ARCHIVE: ${{ steps.built.outputs.archive }}
        run: |
          [[ -z $(git ls-files -- "packages/$PKG/LOCAL") ]] || { echo "::error::$PKG artifact, packages/$PKG/LOCAL keeps it off CI"; exit 1; }
          mapfile -t names < <(awk '$1 == "Name:" { n = $2; print n } $1 == "%package" { print ($2 == "-n" ? $3 : n "-" $2) }' "packages/$PKG"/*.spec)
          (( ${#names[@]} )) || { echo "::error::no spec Name in packages/$PKG"; exit 1; }
          bad=$(printf '%s\n' "${names[@]}" | grep -vE '^[A-Za-z0-9._+-]+$' || true)
          [[ -z $bad ]] || { echo "::error::package names in packages/$PKG that are not literal: $bad"; exit 1; }
          re="^rpms/($(printf '%s\n' "${names[@]}" | sed 's/[.+]/\\&/g' | paste -sd'|'))-[0-9][^/]*\.rpm$"
          oci=$RUNNER_TEMP/oci
          mkdir -p "$oci"
          tar -xf "$ARCHIVE" -C "$oci" --no-same-owner --no-same-permissions
          mapfile -t manifests < <(jq -r '.manifests[].digest' "$oci/index.json")
          [[ ${#manifests[@]} == 1 && ${manifests[0]} =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::expected one manifest, got ${manifests[*]}"; exit 1; }
          mapfile -t layers < <(jq -r '.layers[].digest' "$oci/blobs/sha256/${manifests[0]#sha256:}")
          [[ ${#layers[@]} == 1 && ${layers[0]} =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::expected one layer, got ${#layers[@]}"; exit 1; }
          listing=$(tar -tvf "$oci/blobs/sha256/${layers[0]#sha256:}")
          bad=$(RE=$re awk '{ p = $NF; sub(/^\.\//, "", p) } !(($1 ~ /^d/ && p == "rpms/") || ($1 ~ /^-/ && p ~ ENVIRON["RE"])) { print }' <<< "$listing")
          [[ -z $bad ]] || { echo "::error::entries other than rpms/ and ${names[*]} RPMs: $bad"; exit 1; }
          grep -q '\.rpm$' <<< "$listing" || { echo "::error::no RPM in the archive"; exit 1; }
          rm -rf "$oci"
          echo "${names[*]}: $(grep -c '\.rpm$' <<< "$listing") RPMs"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        if: steps.built.outputs.archive != ''
        with:
          cosign-release: v2.6.3

      - name: Push, sign, verify
        if: steps.built.outputs.archive != ''
        env:
          HASH: ${{ steps.built.outputs.hash }}
          ARCHIVE: ${{ steps.built.outputs.archive }}
          REPLACE: ${{ steps.built.outputs.replace }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          sig() {
            local out
            for _ in 1 2 3; do
              if out=$(cosign verify --key "$PUBKEY" "$1" 2>&1 > /dev/null); then echo signed; return; fi
              if grep -qE 'no signatures found|no matching signatures: (.*invalid signature|signature not found in transparency log)' <<< "$out"; then
                echo unsigned
                return
              fi
              echo "::warning::cosign verify $1: $out" >&2
              sleep 10
            done
            echo "::error::cosign verify $1: $out" >&2
            return 1
          }
          skopeo login ghcr.io -u "$GH_ACTOR" --password-stdin <<< "$GH_TOKEN"
          if [[ $REPLACE == true ]]; then
            state=$(sig "$REPO:$HASH")
            if [[ $state == signed ]]; then
              echo "::notice::$REPO:$HASH is signed meanwhile, not pushed"
              exit 0
            fi
          elif err=$(skopeo inspect --raw "docker://$REPO:$HASH" 2>&1 > /dev/null); then
            echo "::notice::$REPO:$HASH appeared meanwhile, not pushed"
            for _ in $(seq 20); do
              state=$(sig "$REPO:$HASH")
              [[ $state == unsigned ]] || exit 0
              sleep 15
            done
            echo "::error::$REPO:$HASH fails cosign verify"
            exit 1
          elif ! grep -qiE 'manifest unknown|404|403' <<< "$err"; then
            echo "::error::$err"
            exit 1
          fi
          skopeo copy --digestfile "$RUNNER_TEMP/digest" "oci-archive:$ARCHIVE" "docker://$REPO:$HASH"
          digest=$(cat "$RUNNER_TEMP/digest")
          cosign login ghcr.io -u "$GH_ACTOR" --password-stdin <<< "$GH_TOKEN"
          cosign sign --yes --new-bundle-format=false --key env://COSIGN_PRIVATE_KEY "$REPO@$digest"
          cosign verify --key "$PUBKEY" "$REPO@$digest" > /dev/null
          echo "$REPO:$HASH $digest"
