name: image

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      cold:
        description: "Skip every cache restore and save"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/seilent/blockie
  PKG_KERNEL: ghcr.io/seilent/blockie/pkg/kernel
  PUBKEY: system_files/usr/share/blockie/keys/blockie.pub
  ROOT: ghcr.io/seilent/blockie/root
  SOURCE_TYPE: application/vnd.blockie.source.v1
  ROOT_TYPE: application/vnd.blockie.root.v1
  FEDORA: registry.fedoraproject.org/fedora:44@sha256:1ff9eb02e4e2d7fb1175becac7139b2960c4fdcccedce81c86ec25b98ef3124d
  ORAS_VERSION: 1.3.4
  ORAS_SHA256: 15702c6e3a4a56a8bd8ac5c17efdbcab56d9bada661ccbcf017f5b10c1d89399

jobs:
  packages:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/packages.yml
    with:
      cold: ${{ inputs.cold == true }}
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

  image:
    needs: packages
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      push_tag: ${{ steps.version.outputs.push_tag }}
      short: ${{ steps.version.outputs.short }}
      channel: ${{ steps.version.outputs.channel }}
      kernel_ref: ${{ steps.kernel.outputs.ref }}
      pkg_refs: ${{ steps.packages.outputs.refs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Disk
        run: build/ci-disk.sh 40

      - name: Install tools
        run: build/ci-need.sh podman:podman skopeo:skopeo

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.3

      - name: Kernel
        id: kernel
        run: |
          hash=$(build/pkg-hash.sh kernel)
          skopeo inspect --no-creds --raw "docker://$PKG_KERNEL:$hash" > "$RUNNER_TEMP/raw" \
            || { echo "::error::$PKG_KERNEL:$hash is missing; it comes from SePC (just pkg-push kernel) before the git push"; exit 1; }
          digest=sha256:$(sha256sum < "$RUNNER_TEMP/raw" | cut -d' ' -f1)
          cosign verify --key "$PUBKEY" "$PKG_KERNEL@$digest" > /dev/null
          build/pkg-check.sh "$PKG_KERNEL@$digest" "$RUNNER_TEMP/check"
          echo "ref=$PKG_KERNEL@$digest" >> "$GITHUB_OUTPUT"
          echo "$PKG_KERNEL:$hash $digest"

      - name: Packages
        id: packages
        run: |
          mkdir -p "$RUNNER_TEMP/pkgs"
          refs=()
          for name in $(git ls-files -- 'packages/*/build.sh' | cut -d/ -f2); do
            [[ $name != kernel ]] || continue
            hash=$(build/pkg-hash.sh "$name")
            repo=$IMAGE/pkg/$name
            skopeo inspect --no-creds --raw "docker://$repo:$hash" > "$RUNNER_TEMP/raw" || {
              if [[ -n $(git ls-files -- "packages/$name/LOCAL") ]]; then
                echo "::error::$repo:$hash is missing; it comes from SePC (just pkg-push $name) before the git push"
              else
                echo "::error::$repo:$hash is missing; the packages job did not publish it"
              fi
              exit 1
            }
            digest=sha256:$(sha256sum < "$RUNNER_TEMP/raw" | cut -d' ' -f1)
            cosign verify --key "$PUBKEY" "$repo@$digest" > /dev/null
            build/pkg-check.sh "$repo@$digest" "$RUNNER_TEMP/check" "$RUNNER_TEMP/pkgs/$name"
            refs+=("$repo@$digest")
            echo "$repo:$hash $digest"
          done
          echo "refs=${refs[*]}" >> "$GITHUB_OUTPUT"

      - name: Version
        id: version
        run: |
          short=${GITHUB_SHA::7}
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            push_tag=testing-$short
            channel=true
          else
            push_tag=dev-$short
            channel=false
          fi
          {
            echo "short=$short"
            echo "push_tag=$push_tag"
            echo "channel=$channel"
            echo "version=$(date -u +%Y%m%d).$short"
          } >> "$GITHUB_OUTPUT"
          echo "$push_tag"

      - name: Dnf cache dir
        id: dnf
        run: |
          dir=$RUNNER_TEMP/buildah-tmp/buildah-cache-$(id -u)/blockie-dnf
          mkdir -p "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: inputs.cold != true
        with:
          path: ${{ steps.dnf.outputs.dir }}
          key: dnf-rpms-aarch64-${{ steps.dnf.outputs.date }}
          restore-keys: dnf-rpms-aarch64-

      - name: Build
        id: build
        env:
          KERNEL_REF: ${{ steps.kernel.outputs.ref }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.push_tag }}
          DNF_DIR: ${{ steps.dnf.outputs.dir }}
        run: |
          find "$DNF_DIR" -mindepth 2 -maxdepth 2 ! -name packages -exec rm -rf {} +
          find "$DNF_DIR" -type f ! -name '*.rpm' -delete
          echo "dnf cache before the build: $(find "$DNF_DIR" -name '*.rpm' | wc -l) rpms"
          TMPDIR=$RUNNER_TEMP/buildah-tmp podman build \
            --build-arg "BLOCKIE_DNF_OPTS=--setopt=keepcache=True --disablerepo=updates-archive" \
            --build-arg "KERNEL_REF=$KERNEL_REF" \
            --build-arg "BLOCKIE_VERSION=$VERSION" \
            --build-arg "BLOCKIE_REVISION=$GITHUB_SHA" \
            --build-context "pkgs=$RUNNER_TEMP/pkgs" \
            -t "$IMAGE:$TAG" .
          base=$(sed -n 's/^FROM \([^ ]*\/fedora-bootc:[^ ]*\)$/\1/p' Containerfile)
          [[ -n $base ]] || { echo "::error::no fedora-bootc FROM line in Containerfile"; exit 1; }
          mapfile -t want < <(podman image inspect --format '{{range .RootFS.Layers}}{{println .}}{{end}}' "$base" | sed '/^$/d')
          mapfile -t got < <(podman image inspect --format '{{range .RootFS.Layers}}{{println .}}{{end}}' "$IMAGE:$TAG" | sed '/^$/d')
          n=${#want[@]}
          [[ $n -gt 0 && ${got[*]:0:n} == "${want[*]}" ]] || { echo "::error::image layers do not start with the $base layers"; exit 1; }
          podman image inspect --format '{{.Size}}' "$IMAGE:$TAG" | awk '{ printf "image %.2f GB\n", $1 / 1e9 }'
          df -H /
          find "$RUNNER_TEMP/buildah-tmp" -maxdepth 3 -type d
          if [[ -d $DNF_DIR/. && -n $(ls -A "$DNF_DIR") ]]; then
            sha256sum "$DNF_DIR"/*/repodata/repomd.xml || true
            podman run --rm "$IMAGE:$TAG" rpm -qa --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}.rpm\n' | sort > "$RUNNER_TEMP/nevra"
            rm -rf "${DNF_DIR:?}"/@commandline-*
            find "$DNF_DIR" -mindepth 2 -maxdepth 2 ! -name packages -exec rm -rf {} +
            find "$DNF_DIR" -type f ! -name '*.rpm' -delete
            while read -r f; do
              grep -qxF "${f##*/}" "$RUNNER_TEMP/nevra" || rm -f "$f"
            done < <(find "$DNF_DIR" -name '*.rpm')
            echo "dnf cache to save: $(find "$DNF_DIR" -name '*.rpm' | wc -l) rpms, $(du -sh "$DNF_DIR" | cut -f1)"
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no dnf cache at $DNF_DIR, nothing to save"
          fi

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: github.ref == 'refs/heads/main' && inputs.cold != true && steps.build.outputs.save == 'true'
        with:
          path: ${{ steps.dnf.outputs.dir }}
          key: dnf-rpms-aarch64-${{ steps.dnf.outputs.date }}

      - name: Westonpack dir
        id: wpdir
        run: echo "dir=$RUNNER_TEMP/westonpack" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: inputs.cold != true
        with:
          path: ${{ steps.wpdir.outputs.dir }}
          key: westonpack-0bccaeebc11296bb1fe4278c9677cb82965c5a04bcd63745fa09d78228bc1a93

      - name: Westonpack
        id: westonpack
        env:
          DIR: ${{ steps.wpdir.outputs.dir }}
          URL: https://github.com/PortsMaster/PortMaster-New/releases/download/2025-07-24_0745/weston_pkg_0.2.squashfs
          SHA256: 0bccaeebc11296bb1fe4278c9677cb82965c5a04bcd63745fa09d78228bc1a93
        run: |
          f=$DIR/weston_pkg_0.2.squashfs
          mkdir -p "$DIR"
          if [[ -f $f && $(sha256sum < "$f" | cut -d' ' -f1) == "$SHA256" ]]; then
            echo "weston_pkg_0.2.squashfs from the cache"
          else
            rm -f "$f" "$f.part"
            if ! curl -fsSL --retry 3 -o "$f.part" "$URL"; then
              rm -f "$f.part"
              echo "::warning::$URL did not download, the westonpack check is skipped"
            elif [[ $(sha256sum < "$f.part" | cut -d' ' -f1) != "$SHA256" ]]; then
              rm -f "$f.part"
              echo "::warning::$URL is not sha256 $SHA256, the westonpack check is skipped"
            else
              mv "$f.part" "$f"
              echo "save=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          if [[ -f $f ]]; then
            echo "file=$f" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: github.ref == 'refs/heads/main' && inputs.cold != true && steps.westonpack.outputs.save == 'true'
        with:
          path: ${{ steps.wpdir.outputs.dir }}
          key: westonpack-0bccaeebc11296bb1fe4278c9677cb82965c5a04bcd63745fa09d78228bc1a93

      - name: Test
        env:
          TAG: ${{ steps.version.outputs.push_tag }}
          WESTONPACK: ${{ steps.westonpack.outputs.file }}
        run: |
          suite() {
            rc=0
            timeout -k 30 900 "$@" || rc=$?
            case $rc in
              0) ;;
              124 | 137) echo "::error::$t ran past 900 s and was stopped (rc $rc)" ;;
              *) echo "::error::$t failed (rc $rc)" ;;
            esac
            return "$rc"
          }
          for t in image units blobs audio wifi bt boot-ok clocks bootctl data session hotkeyd power game game-cmd ports ports-helper ports-steam android android-sched; do
            suite podman run --rm -v "$PWD/tests:/tests:ro" -v "$PWD/boot:/repo-boot:ro" "$IMAGE:$TAG" "/tests/$t.sh"
          done
          t=westonpack
          if [[ -n $WESTONPACK ]]; then
            suite podman run --rm -v "$PWD/tests:/tests:ro" -v "$WESTONPACK:/westonpack/weston_pkg_0.2.squashfs:ro" \
              "$IMAGE:$TAG" /tests/westonpack.sh /westonpack/weston_pkg_0.2.squashfs
          else
            echo "::warning::no weston_pkg_0.2.squashfs, the westonpack check is skipped"
          fi
          t=android-polkit
          build/ci-need.sh node:nodejs
          suite env BLOCKIE_ANDROID_ROOT="$PWD/system_files" tests/android.sh polkit
          t=setd-polkit
          suite env SETD_RULES="$PWD/system_files/usr/share/polkit-1/rules.d/50-blockie-timezone.rules" tests/setd.sh polkit
          t=session-polkit
          suite env SESSION_RULES="$PWD/system_files/usr/share/polkit-1/rules.d/50-blockie-session.rules" tests/session.sh polkit
          t=bootctl-polkit
          suite env BOOT_RULES="$PWD/system_files/usr/share/polkit-1/rules.d/50-blockie-boot.rules" tests/bootctl.sh polkit
          t=network-polkit
          suite env NETWORK_RULES="$PWD/system_files/usr/share/polkit-1/rules.d/50-blockie-network.rules" tests/wifi.sh polkit
          t=steam-polkit
          suite env STEAM_RULES="$PWD/system_files/usr/share/polkit-1/rules.d/50-blockie-steam.rules" tests/ports-steam.sh polkit
          t=setd
          suite podman run --rm -v "$PWD/tests:/tests:ro" "$IMAGE:$TAG" \
            bash -c 'dnf -y -q install dbus-daemon > /dev/null && /tests/setd.sh'

      - name: Source RPMs
        env:
          TAG: ${{ steps.version.outputs.push_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/srpms"
          podman run --rm "$IMAGE:$TAG" rpm -qa --qf '%{NAME}\t%{SOURCERPM}\t%{VENDOR}\n' > "$RUNNER_TEMP/srpms/srpms.tsv"
          wc -l < "$RUNNER_TEMP/srpms/srpms.tsv"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: srpms-${{ steps.version.outputs.short }}
          path: ${{ runner.temp }}/srpms
          if-no-files-found: error
          retention-days: 1

      - name: Push
        id: push
        env:
          TAG: ${{ steps.version.outputs.push_tag }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          podman login ghcr.io -u "$GH_ACTOR" --password-stdin <<< "$GH_TOKEN"
          podman push --digestfile "$RUNNER_TEMP/digest" "$IMAGE:$TAG"
          digest=$(cat "$RUNNER_TEMP/digest")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$TAG $digest"
          df -H /

      - name: Unsigned check
        env:
          TAG: ${{ steps.version.outputs.push_tag }}
        run: |
          podman run --rm -v "$PWD/tests:/tests:ro" "$IMAGE:$TAG" /tests/verify-sig.sh unsigned "docker://$IMAGE:$TAG"

      - name: Sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          cosign login ghcr.io -u "$GH_ACTOR" --password-stdin <<< "$GH_TOKEN"
          cosign sign --yes --new-bundle-format=false --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"

      - name: Verify
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign verify --key "$PUBKEY" "$IMAGE@$DIGEST" > /dev/null

      - name: Signed check
        env:
          TAG: ${{ steps.version.outputs.push_tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          podman run --rm -v "$PWD/tests:/tests:ro" "$IMAGE:$TAG" \
            /tests/verify-sig.sh signed "docker://$IMAGE@$DIGEST" dir:/var/tmp/signed

  root:
    needs: image
    if: needs.image.outputs.channel == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
      TAG: ${{ needs.image.outputs.push_tag }}
      SHORT: ${{ needs.image.outputs.short }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Disk
        run: build/ci-disk.sh 40

      - name: Install tools
        run: |
          build/ci-need.sh podman:podman mkfs.ext4:e2fsprogs pigz:pigz busybox:busybox-static file:file
          tarball=oras_${ORAS_VERSION}_linux_arm64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/oras-project/oras/releases/download/v$ORAS_VERSION/$tarball"
          echo "$ORAS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" oras
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.3

      - name: Pull
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign verify --key "$PUBKEY" "$IMAGE@$DIGEST" > /dev/null
          sudo podman login ghcr.io -u "$GH_ACTOR" --password-stdin <<< "$GH_TOKEN"
          sudo podman pull "$IMAGE@$DIGEST"
          got=$(sudo podman image inspect --format '{{.Digest}}' "$IMAGE@$DIGEST")
          [[ $got == "$DIGEST" ]] || { echo "::error::pulled $got, not $DIGEST"; exit 1; }

      - name: Install
        run: |
          . build/root.conf
          df -h /
          img=$RUNNER_TEMP/root.ext4
          truncate -s "$FS_BYTES" "$img"
          mkfs.ext4 -q -F -b 4096 -I 256 -i 16384 -m 1 -O "none,$FS_FEATURES" \
            -E lazy_itable_init=0,lazy_journal_init=0,nodiscard -L "$FS_LABEL" -U "$FS_UUID" "$img"
          sudo mkdir -p /mnt/target
          sudo mount -o loop "$img" /mnt/target
          jq '.transports["containers-storage"] = {"": [{"type": "insecureAcceptAnything"}]}' \
            system_files/etc/containers/policy.json > "$RUNNER_TEMP/install-policy.json"
          sudo podman run --rm --privileged --pid=host --security-opt label=type:unconfined_t \
            -v /dev:/dev -v /var/lib/containers:/var/lib/containers -v /mnt/target:/target \
            -v "$RUNNER_TEMP/install-policy.json:/etc/containers/policy.json:ro" \
            "$IMAGE@$DIGEST" bootc install to-filesystem --bootloader none --stateroot "$STATEROOT" \
            --disable-selinux --skip-fetch-check --target-transport oci --target-imgref "$TARGET_IMGREF" /target
          sudo podman run --rm -v /mnt/target:/target:ro -v "$PWD/tests:/tests:ro" "$IMAGE@$DIGEST" \
            /tests/root.sh /target "$DIGEST"
          sudo podman rmi "$IMAGE@$DIGEST"
          read -r used avail < <(df -B1 --output=used,avail /mnt/target | tail -n 1)
          echo "target used $used avail $avail"
          (( used * 100 <= (used + avail) * 75 )) || { echo "::error::/mnt/target is over 75 % used"; exit 1; }
          sudo umount /mnt/target
          sudo e2fsck -fn "$img"
          df -h /

      - name: Seal
        run: |
          . build/root.conf
          img=$RUNNER_TEMP/root.ext4
          out=$RUNNER_TEMP/root
          mkdir -p "$out"
          gz=blockie-root-$SHORT.ext4.gz
          android=has_journal,ext_attr,resize_inode,dir_index,filetype,extent,flex_bg,sparse_super,large_file,huge_file,dir_nlink,extra_isize,metadata_csum,64bit
          [[ $FS_FEATURES == "$android" ]] || { echo "::error::FS_FEATURES is not the feature set of the card's Android made filesystems"; exit 1; }
          [[ $(stat -c %s "$img") == "$FS_BYTES" ]] || { echo "::error::$img is not $FS_BYTES bytes"; exit 1; }
          dumpe2fs -h "$img" 2> /dev/null > "$RUNNER_TEMP/sb"
          sb() { sed -n "s/^Filesystem $1: *//p" "$RUNNER_TEMP/sb"; }
          [[ $(sb 'volume name') == "$FS_LABEL" ]] || { echo "::error::label is $(sb 'volume name'), not $FS_LABEL"; exit 1; }
          [[ $(sb UUID) == "$FS_UUID" ]] || { echo "::error::UUID is $(sb UUID), not $FS_UUID"; exit 1; }
          [[ $(sb state) == clean ]] || { echo "::error::state is $(sb state)"; exit 1; }
          [[ $(sb features | tr ' ' '\n' | sort | xargs) == "$(tr , '\n' <<< "$FS_FEATURES" | sort | xargs)" ]] \
            || { echo "::error::features are $(sb features), not $FS_FEATURES"; exit 1; }
          build/root-seal.sh "$img" "$out/$gz" > "$RUNNER_TEMP/seal"
          . "$RUNNER_TEMP/seal"
          {
            echo "ROOT_GZ=$gz"
            echo "ROOT_GZ_SHA=$ROOT_GZ_SHA"
            echo "ROOT_BYTES=$FS_BYTES"
            echo "ROOT_SHA=$ROOT_SHA"
            echo "ROOT_HEAD_SHA=$ROOT_HEAD_SHA"
            echo "ROOT_BODY_SHA=$ROOT_BODY_SHA"
          } > "$out/root.conf"
          {
            echo "IMAGE=$IMAGE@$DIGEST"
            echo "TAG=$TAG"
            echo "REVISION=$GITHUB_SHA"
          } > "$out/root.info"
          cat "$out/root.conf" "$out/root.info"
          ls -l "$out"
          df -h /

      - name: Prepare root
        run: |
          [[ -f boot/ostree-root ]] || { echo "::error::boot/ostree-root missing"; exit 1; }
          sudo BUSYBOX=/bin/busybox tests/ostree-root.sh "$RUNNER_TEMP/root.ext4" boot/ostree-root
          rm -f "${RUNNER_TEMP:?}/root.ext4"

      - name: Push
        id: push
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/root"
          oras login ghcr.io -u "$GH_ACTOR" --password-stdin <<< "$GH_TOKEN"
          . root.conf
          art=$(oras push --artifact-type "$ROOT_TYPE" --format go-template --template '{{.digest}}' \
            "$ROOT:$TAG" "$ROOT_GZ" root.conf root.info)
          [[ $art == sha256:* ]] || { echo "::error::no artifact digest: $art"; exit 1; }
          echo "digest=$art" >> "$GITHUB_OUTPUT"
          echo "$ROOT:$TAG $art"

      - name: Sign
        env:
          ART: ${{ steps.push.outputs.digest }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          cosign login ghcr.io -u "$GH_ACTOR" --password-stdin <<< "$GH_TOKEN"
          cosign sign --yes --new-bundle-format=false --key env://COSIGN_PRIVATE_KEY "$ROOT@$ART"
          cosign verify --key "$PUBKEY" "$ROOT@$ART" > /dev/null

  source:
    needs: image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
      SHORT: ${{ needs.image.outputs.short }}
      MODE: ${{ needs.image.outputs.channel == 'true' && 'full' || 'base' }}
      KERNEL_REF: ${{ needs.image.outputs.kernel_ref }}
      PKG_REFS: ${{ needs.image.outputs.pkg_refs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 6

      - name: Disk
        run: build/ci-disk.sh 40

      - name: Install tools
        run: |
          build/ci-need.sh podman:podman
          tarball=oras_${ORAS_VERSION}_linux_arm64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/oras-project/oras/releases/download/v$ORAS_VERSION/$tarball"
          echo "$ORAS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" oras
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.3

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: srpms-${{ needs.image.outputs.short }}
          path: ${{ runner.temp }}/srpms

      - name: Source cache
        if: env.MODE == 'full'
        run: build/source-cache.sh "$RUNNER_TEMP/cache"

      - name: Sources
        env:
          BLOCKIE_SOURCE_CACHE: ${{ env.MODE == 'full' && format('{0}/cache', runner.temp) || '' }}
        run: |
          read -ra refs <<< "$PKG_REFS"
          build/source-artifact.sh "$RUNNER_TEMP/srpms/srpms.tsv" "$RUNNER_TEMP/source" "$MODE" "$KERNEL_REF" "${refs[@]}"
          df -H /

      - name: Attach
        id: attach
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          oras login ghcr.io -u "$GH_ACTOR" --password-stdin <<< "$GH_TOKEN"
          cd "$RUNNER_TEMP/source"
          mapfile -t files < <(cut -d' ' -f1 SOURCES)
          art=$(oras attach --artifact-type "$SOURCE_TYPE" --format go-template --template '{{.digest}}' \
            "$IMAGE@$DIGEST" "${files[@]}" SOURCES)
          [[ $art == sha256:* ]] || { echo "::error::no artifact digest: $art"; exit 1; }
          echo "digest=$art" >> "$GITHUB_OUTPUT"
          echo "attached $IMAGE@$art"

      - name: Check source
        env:
          ART: ${{ steps.attach.outputs.digest }}
        run: |
          names=$(printf '%s\n' "blockie-image-$SHORT.tar.gz"; awk '{ print $2 }' packages/*/SOURCE.sha256)
          upstream=$(sed -n 's/^SRPM_URL=//p' packages/*/SOURCE.env | sed 's|.*/||')
          [[ -z $upstream ]] || names+=$'\n'$upstream
          if [[ $MODE == full ]]; then
            own=$(awk '$1 == "Name:" { print $2 }' packages/*/*.spec
              while read -r f; do
                [[ -z $f ]] || echo "${f%-*-*.src.rpm}"
              done <<< "$upstream")
            names+=$'\n'$(awk -F'\t' 'NR == FNR { own[$1] = 1; next } { n = $2; sub(/-[^-]*-[^-]*\.src\.rpm$/, "", n) }
              !(n in own) && $2 != "(none)" { print $2 }' <(printf '%s\n' "$own") "$RUNNER_TEMP/srpms/srpms.tsv" | sort -u)
          fi
          cd "$RUNNER_TEMP/source"
          [[ $(cut -d' ' -f1 SOURCES | sort) == "$(sort <<< "$names")" ]] || { echo "::error::SOURCES is not the $MODE set"; exit 1; }
          refs=$(oras discover --artifact-type "$SOURCE_TYPE" --format json --depth 1 "$IMAGE@$DIGEST" \
            | jq -r 'if (.referrers | type) == "array" then .referrers[].digest else error("no referrers list") end')
          grep -qxF "$ART" <<< "$refs" || { echo "::error::$IMAGE@$ART is not a referrer of $DIGEST"; exit 1; }
          oras manifest fetch "$IMAGE@$ART" > "$RUNNER_TEMP/source.json"
          got=$(jq -r '.layers[] | select(.annotations["org.opencontainers.image.title"] != "SOURCES")
            | "\(.annotations["org.opencontainers.image.title"]) \(.digest)"' "$RUNNER_TEMP/source.json" | sort)
          [[ $got == "$(awk '{ print $1 " sha256:" $2 }' SOURCES | sort)" ]] || { echo "::error::layers differ from SOURCES"; exit 1; }
          echo "$IMAGE@$ART: $MODE, $(wc -l < SOURCES) files"

      - name: Sign source
        env:
          ART: ${{ steps.attach.outputs.digest }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          cosign login ghcr.io -u "$GH_ACTOR" --password-stdin <<< "$GH_TOKEN"
          cosign sign --yes --new-bundle-format=false --key env://COSIGN_PRIVATE_KEY "$IMAGE@$ART"
          cosign verify --key "$PUBKEY" "$IMAGE@$ART" > /dev/null
