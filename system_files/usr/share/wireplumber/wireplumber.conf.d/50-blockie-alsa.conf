monitor.alsa.rules = [
  {
    matches = [
      {
        api.alsa.card.name = "mt6768-mt6358"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = true
        api.alsa.use-ucm = true
        api.alsa.soft-mixer = true
        api.acp.disable-pro-audio = true
        device.profile-set = "blockie-ucm-only.conf"
      }
    }
  }
]
