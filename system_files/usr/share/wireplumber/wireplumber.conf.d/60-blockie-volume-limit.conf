wireplumber.components = [
  {
    name = blockie/volume-limit.lua, type = script/lua
    provides = custom.blockie-volume-limit
    requires = [ support.settings, api.mixer ]
    after = [ support.standard-event-source ]
    before = [ monitor.alsa ]
  }
  {
    type = virtual, provides = custom.blockie-audio
    wants = [ custom.blockie-volume-limit ]
  }
]

wireplumber.profiles = {
  main = {
    custom.blockie-audio = required
  }
}

wireplumber.settings.schema = {
  blockie.volume-limit = {
    name = "Volume limit"
    description = "The volume limit as a share of the card's full scale"
    type = "float"
    default = 1.0
    min = 0.05
    max = 1.0
  }
}
