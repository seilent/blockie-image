<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="blockie-set">
    <allow own="net.seilent.Blockie.Settings"/>
  </policy>
  <policy context="default">
    <allow send_destination="net.seilent.Blockie.Settings" send_interface="net.seilent.Blockie.Settings1" send_member="Get"/>
    <allow send_destination="net.seilent.Blockie.Settings" send_interface="net.seilent.Blockie.Settings1" send_member="List"/>
    <allow send_destination="net.seilent.Blockie.Settings" send_interface="net.seilent.Blockie.Settings1" send_member="Schema"/>
    <allow send_destination="net.seilent.Blockie.Settings" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="net.seilent.Blockie.Settings" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
  <policy user="root">
    <allow send_destination="net.seilent.Blockie.Settings" send_interface="net.seilent.Blockie.Settings1" send_member="Set"/>
  </policy>
  <policy user="blockie">
    <allow send_destination="net.seilent.Blockie.Settings" send_interface="net.seilent.Blockie.Settings1" send_member="Set"/>
  </policy>
</busconfig>
