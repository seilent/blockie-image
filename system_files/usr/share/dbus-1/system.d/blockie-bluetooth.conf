<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="blockie">
    <deny send_destination="org.bluez"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.Adapter1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.Device1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.AgentManager1" send_member="RegisterAgent"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.AgentManager1" send_member="UnregisterAgent"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.AgentManager1" send_member="RequestDefaultAgent"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.Media1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.MediaTransport1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.ProfileManager1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.BatteryProviderManager1"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
