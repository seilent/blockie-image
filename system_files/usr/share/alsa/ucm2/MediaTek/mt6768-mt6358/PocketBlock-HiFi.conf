SectionVerb {
	EnableSequence [
		cset "name='primary_play_scenario' 1"
		cset "name='ADDA_DL_CH1 DL1_CH1' 1"
		cset "name='ADDA_DL_CH2 DL1_CH2' 1"
		cset "name='DAC In Mux' 'Normal Path'"
	]

	DisableSequence [
		cset "name='ADDA_DL_CH1 DL1_CH1' 0"
		cset "name='ADDA_DL_CH2 DL1_CH2' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		cset "name='Lineout Volume' 18,18"
		cset "name='Headset Volume' 18,18"
		cset "name='HPL Mux' 'LoudSPK Playback'"
		cset "name='HPR Mux' 'LoudSPK Playback'"
		cset "name='Ext_Speaker_Amp Switch' on"
	]

	DisableSequence [
		cset "name='Ext_Speaker_Amp Switch' off"
		cset "name='HPL Mux' Open"
		cset "name='HPR Mux' Open"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='Ext_Speaker_Amp Switch' off"
		cset "name='Headset Volume' 18,18"
		cset "name='HPL Mux' 'Audio Playback'"
		cset "name='HPR Mux' 'Audio Playback'"
	]

	DisableSequence [
		cset "name='HPL Mux' Open"
		cset "name='HPR Mux' Open"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		If.jack {
			Condition {
				Type ControlExists
				Control "iface=CARD,name='Headphone Jack'"
			}
			True.JackControl "Headphone Jack"
		}
	}
}
