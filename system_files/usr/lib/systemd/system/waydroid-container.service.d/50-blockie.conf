[Unit]
Requires=blockie-android-prep.service
After=blockie-android-prep.service
RequiresMountsFor=/var/lib/blockie/data

[Service]
ExecStartPre=/usr/libexec/blockie/blockie-android-lxcd
ExecStop=-/usr/bin/timeout 6 /usr/bin/waydroid shell -- /system/bin/reboot -p
ExecStopPost=-/usr/bin/lxc-stop -P /var/lib/waydroid/lxc -n waydroid -k
ExecStopPost=-/usr/bin/sync -f /var/lib/blockie/data
TimeoutStopSec=15
